<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Marauder vertical Moxon-inspired parasitic array with radiator and reflector">
  <!-- ground line -->
  <line x1="20" y1="170" x2="300" y2="170" stroke="#1c1812" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.45"/>

  <!-- ground spikes -->
  <path d="M 96 170 L 92 184 L 100 184 Z" fill="#1c1812" opacity="0.7"/>
  <path d="M 224 170 L 220 184 L 228 184 Z" fill="#1c1812" opacity="0.7"/>

  <!-- mast / base sections -->
  <line x1="96" y1="170" x2="96" y2="149" stroke="#1c1812" stroke-width="2.4"/>
  <line x1="224" y1="170" x2="224" y2="149" stroke="#1c1812" stroke-width="2.4"/>

  <!-- support whips (non-radiating); right whip taller, radiator attaches at each tip -->
  <line x1="96" y1="149" x2="96" y2="40" stroke="#1c1812" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="224" y1="149" x2="224" y2="26" stroke="#1c1812" stroke-width="1.6" stroke-linecap="round"/>

  <!-- reflector (bent, lower horizontal element, non-conducting segment at left) -->
  <line x1="96" y1="100" x2="106" y2="100" stroke="#8fb9a8" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 106 100 L 224 100" stroke="#1f5967" stroke-width="2.2" stroke-linecap="round"/>

  <!-- radiator: single straight line from top of left whip to top of (taller) right whip,
       non-conducting segment at the right end -->
  <path d="M 96 40 L 214 27.1" stroke="#8a2a1a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 214 27.1 L 224 26" stroke="#c98a6a" stroke-width="2.2" stroke-linecap="round"/>

  <!-- feedpoint / unun box just under the radiator, high on the left mast -->
  <rect x="89" y="41" width="14" height="9" fill="#efe6cd" stroke="#1c1812" stroke-width="0.9"/>

  <!-- short feed wire connecting unun to radiator -->
  <path d="M 96 41 L 96 40" stroke="#8a2a1a" stroke-width="1" stroke-dasharray="1.5 2" opacity="0.55"/>

  <!-- counterpoise wire drooping from base of mast -->
  <path d="M 96 155 Q 70 172, 30 168" stroke="#8a5a18" stroke-width="1.1" fill="none"/>
</svg>
